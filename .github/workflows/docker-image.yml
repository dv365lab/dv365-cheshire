name: docker-image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Configure image publishing
        id: publishing
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "image=$DOCKERHUB_USERNAME/cheshire-ci:latest" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "image=dv365-cheshire-ci:latest" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Login to Docker Hub
        if: steps.publishing.outputs.enabled == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Build image and optionally publish
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./.github/Dockerfile
          push: ${{ steps.publishing.outputs.enabled == 'true' }}
          tags: ${{ steps.publishing.outputs.image }}
